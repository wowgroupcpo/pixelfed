; Pixelfed on Vercel (vercel-php) — PHP overrides.
; Note: Vercel Functions have a 4.5 MB request body limit on Hobby,
; so large photo/video uploads cannot work on this deployment regardless.
memory_limit = 1024M
max_execution_time = 60
upload_max_filesize = 25M
post_max_size = 25M
display_errors = Off
log_errors = On
